spring.application.name=food_donation_management

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/doacao_alimentos}
spring.datasource.username=${DB_USER:doacao}
spring.datasource.password=${DB_PASSWORD:doacao}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-com-pelo-menos-32-caracteres}
app.jwt.expiration-hours=8
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}
