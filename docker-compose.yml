# Ambiente de desenvolvimento com hot reload.
# Uso: docker compose up --watch
#
# Usa `develop.watch` (sync) em vez de bind mount: no Windows os eventos de
# arquivo de bind mounts não chegam ao container de forma confiável.
services:
  postgres:
    image: postgres:17-alpine
    container_name: doacao-postgres
    environment:
      POSTGRES_DB: doacao_alimentos
      POSTGRES_USER: doacao
      POSTGRES_PASSWORD: doacao
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doacao -d doacao_alimentos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: dev
    container_name: doacao-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/doacao_alimentos
      DB_USER: doacao
      DB_PASSWORD: doacao
      JWT_SECRET: troque-este-segredo-em-producao-com-pelo-menos-32-caracteres
      CORS_ORIGINS: http://localhost:3000
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 2s
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 1s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        # Copia o código alterado e recompila; o devtools reinicia o Spring.
        - action: sync+exec
          path: ./src
          target: /app/src
          exec:
            command: mvn -B -q compile
        - action: rebuild
          path: ./pom.xml

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: doacao-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
            - package.json
            - package-lock.json
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  postgres-data:
